<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    AIKit 앱 아이콘 — 사진 프레임(크롭 마크) 안의 반짝임.

    ⚠️ **게이지 호를 쓰지 않는다** (2026-09-18 사용자 지정). 여섯 앱의 공통
    기하는 짙은 타일 + 게이지 호였는데, AIKit 은 호를 빼고 **사각 프레임**으로
    간다. 가족과 이어지는 것은 남은 셋이다 —
      · 짙은 먹청 타일 (rx 44 · 같은 그라디언트)
      · 흰 심볼 #eef7f8
      · 골드 포인트 #e8d18a
    호가 빠진 자리의 밀도는 사각 프레임이 메운다. 실루엣 무게가 가족과 비슷하다.

    왜 이 모양인가 —
      크롭 마크   사진을 다루는 앱. 뷰파인더로도 읽힌다. 설명이 필요 없다
      골드 반짝임 AI. TypeLog 의 반짝임과 같은 금색이라 가족으로 읽힌다

    접은 안 셋 (2026-09-18, 넷을 96·56·32·16px 로 구워 비교) —
      대괄호 `[ ]`   깔끔하지만 "프롬프트" 가 개발자에게만 읽힌다
      겹친 카드 두 장 의미는 정확한데 요소가 넷이라 16px 에서 뭉갠다
      말풍선         16px 에서 가장 잘 버티지만 **채팅 앱으로 읽힌다** —
                     이 앱은 채팅 UI 를 쓰지 않기로 했으므로 오해를 만든다

    치수 —
      획 14        호가 없어 심볼이 혼자 서야 하므로 11 보다 굵게
      프레임       42~150 정사각(108). 중심 96 대칭. 팔 길이 26
      반짝임       외반경 32 · 내반경 16. 비율 0.5 는
                   대괄호 때 실측한 값(0.375 는 더하기 기호로 읽혔다)과 같은 결

    → my-obsidian-vault / 20-Design/앱 공통 UI와 아이콘.md · 10-Projects/AIKit.md
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(15)">
      <stop offset="0" stop-color="#134450"/>
      <stop offset="1" stop-color="#071c22"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#tile)"/>

  <!-- 크롭 마크 네 개 — 네 path 를 같은 g 에 두어 획 굵기가 갈라지지 않게 -->
  <g fill="none" stroke="#eef7f8" stroke-width="14"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M42,68 L42,42 L68,42"/>
    <path d="M124,42 L150,42 L150,68"/>
    <path d="M150,124 L150,150 L124,150"/>
    <path d="M68,150 L42,150 L42,124"/>
  </g>

  <!-- 반짝임 — 프레임 가운데. 흰색이면 프레임과 한 덩어리로 읽힌다 -->
  <path d="M96,64 L107.3,84.7 L128,96 L107.3,107.3 L96,128
           L84.7,107.3 L64,96 L84.7,84.7 Z"
        fill="#e8d18a"/>
</svg>
