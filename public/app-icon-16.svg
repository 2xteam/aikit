<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    16px 전용 AIKit 아이콘.

    app-icon.svg 를 16px 로 줄이면 크롭 마크의 팔(26px)이 1px 아래로 내려가
    모서리가 점 네 개로 흩어진다. 32px 에서는 원본이 읽힌다.

    그래서 16px 에서는 **버릴 것을 버린다.**
      · 크롭 마크의 팔 → 짧게 자르고 획을 굵혀 **모서리 덩어리**로 남긴다
      · 반짝임 여덟 꼭짓점 → 마름모 하나로 합친다. 4px 안에 갈래가 안 나온다
    남기는 것은 **네 모서리와 가운데 덩어리**다. 이게 이 아이콘의 정체다.

    프레임을 안쪽으로 당긴다(48~144) — 16px 에서 가장자리에 붙으면 타일의
    둥근 모서리(rx 44)에 잘려 나간다.

    → my-obsidian-vault / 20-Design/앱 공통 UI와 아이콘.md
  -->
  <defs>
    <linearGradient id="tile16" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(15)">
      <stop offset="0" stop-color="#134450"/>
      <stop offset="1" stop-color="#071c22"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#tile16)"/>

  <!-- 모서리 덩어리 — 팔을 짧게(20) 하고 획을 22 로 굵힌다 -->
  <g fill="none" stroke="#eef7f8" stroke-width="22"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M48,68 L48,48 L68,48"/>
    <path d="M124,48 L144,48 L144,68"/>
    <path d="M144,124 L144,144 L124,144"/>
    <path d="M68,144 L48,144 L48,124"/>
  </g>

  <!-- 마름모 하나. 반짝임의 갈래를 지우고 덩어리만 남긴다 -->
  <path d="M96,66 L126,96 L96,126 L66,96 Z" fill="#e8d18a"/>
</svg>
